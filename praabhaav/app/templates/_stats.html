<section class="stats">
  <div class="stat"><span class="label">Waiting for payment</span><span class="value" data-count="{{ stats.pending }}">{{ stats.pending }}</span></div>
  <div class="stat"><span class="label">Amount pending</span><span class="value" data-count="{{ stats.pending_amount }}" data-format="inr">₹{{ stats.pending_amount | inr }}</span></div>
  <a class="stat {% if stats.overdue %}alert{% endif %}" href="/admin/payouts"><span class="label">Overdue &gt;48h</span><span class="value" data-count="{{ stats.overdue }}">{{ stats.overdue }}</span></a>
  <div class="stat {% if stats.issues %}alert{% endif %}"><span class="label">Reel issues</span><span class="value" data-count="{{ stats.issues }}">{{ stats.issues }}</span></div>
  <a class="stat {% if stats.open_tickets %}alert{% endif %}" href="/admin/tickets"><span class="label">Open queries</span><span class="value" data-count="{{ stats.open_tickets }}">{{ stats.open_tickets }}</span></a>
</section>
