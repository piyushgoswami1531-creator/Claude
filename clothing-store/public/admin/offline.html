<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0A0A; color: #D4D4D4; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { color: #FAFAFA; font: 600 28px Georgia, serif; margin: 0 0 8px; }
  button { margin-top: 24px; height: 56px; padding: 0 32px; border: 0; border-radius: 999px; background: #F5F5F5; color: #0A0A0A; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <h1>No internet connection</h1>
    <p>Please check your Wi-Fi or mobile data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
